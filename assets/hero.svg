<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" role="img" aria-labelledby="title desc"><title id="title">Task Shelf — visual mark</title><desc id="desc">Original animated illustration for task-shelf; motion is decorative and respects reduced-motion preferences.</desc><defs><linearGradient id="wash" x1="0" x2="1"><stop stop-color="#D9A441"/><stop offset="1" stop-color="#302B27"/></linearGradient></defs><style>.float{transform-box:fill-box;transform-origin:center;animation:float 4.8s ease-in-out infinite}.dash{animation:dash 7s linear infinite}@keyframes float{50%{transform:translateY(-8px)}}@keyframes dash{to{stroke-dashoffset:-72}}@media(prefers-reduced-motion:reduce){.float,.dash{animation:none}}</style><rect width="900" height="280" rx="22" fill="#302B27"/><path d="M0 220C170 160 250 300 420 210S700 150 900 205V280H0Z" fill="url(#wash)" opacity=".22"/><g><rect x="600" y="62" width="180" height="155" rx="12" fill="#443C33" stroke="#D9A441" stroke-width="3"/><path d="M630 105L642 117L662 91" fill="none" stroke="#A8C686" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M680 105H750M630 150H750M630 182H720" stroke="#D9A441" stroke-width="5" stroke-linecap="round"/><g class="float"><circle cx="790" cy="55" r="7" fill="#A8C686"/><circle cx="580" cy="210" r="6" fill="#D9A441"/></g></g><text x="64" y="104" fill="#F8FAFC" font-family="ui-monospace,monospace" font-size="15" letter-spacing="2">TASK-SHELF</text><text x="64" y="145" fill="#F8FAFC" font-family="Georgia,serif" font-size="31">Task Shelf</text><text x="64" y="178" fill="#A8C686" font-family="Arial,sans-serif" font-size="14">Small tool. Clear signal.</text></svg>